# CI за FOCUS Lab.
#
# На секој push кон main: прво се пуштаат тестовите, и само ако поминат се
# градат и праќаат двата Docker имиџа на Docker Hub. Обратниот ред не би имал
# смисла — нема потреба да се објавува имиџ што не поминал тест.
#
# Потребно во репото, Settings → Secrets and variables → Actions:
#
#   Variables:  DOCKERHUB_USERNAME — корисничкото име на Docker Hub
#   Secrets:    DOCKERHUB_TOKEN    — access token од Docker Hub (не лозинката)
#
# Името е променлива, не секрет: секретите се маскираат во логот, па името на
# имиџот би се гледало како *** и секоја грешка би била нечитлива.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  test:
    name: Тестови
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Тестови на бекендот
        working-directory: backend
        run: mvn -B --no-transfer-progress test

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависности на фронтендот
        working-directory: frontend
        run: npm ci

      - name: Проверка на типовите
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Градење на фронтендот
        working-directory: frontend
        run: npm run build

  images:
    name: Имиџ (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    # Имиџи се праќаат само од main. Pull request-от се тестира, но не објавува.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      # Без ова, паѓањето на едниот го прекинува другиот и се гледа само
      # половина од проблемот
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      # Инаку најавата паѓа со „Username and password required", што не кажува
      # кое од двете го нема
      - name: Проверка на подготовката
        run: |
          missing=""
          [ -z "${{ vars.DOCKERHUB_USERNAME }}" ] && missing="$missing\n  - променлива DOCKERHUB_USERNAME (Settings → Secrets and variables → Actions → Variables)"
          [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ] && missing="$missing\n  - секрет DOCKERHUB_TOKEN (истата страница, таб Secrets)"

          if [ -n "$missing" ]; then
            echo "Не можам да праќам имиџи — недостасува:"
            printf "$missing\n"
            exit 1
          fi

          echo "Ќе праќам на docker.io/${{ vars.DOCKERHUB_USERNAME }}/focus-lab-*"

      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Најава на Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Секој имиџ добива две ознаки: latest (последна состојба на main) и
      # кратката sha на комитот, за да може да се врати точна верзија.
      - name: Ознаки
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ vars.DOCKERHUB_USERNAME }}/focus-lab-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Градење и праќање
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кешот меѓу пуштањата: без него Maven ги симнува сите зависности
          # одново на секој push и градењето трае неколку минути повеќе.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Runner-ите на GitHub се amd64. За да работи имиџот и на ARM машина
          # (Apple Silicon), додај linux/arm64 — но бекендот тогаш се гради под
          # емулација и трае многу подолго.
          platforms: linux/amd64
