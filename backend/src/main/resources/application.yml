server:
  port: 8080

spring:
  application:
    name: focus-lab-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:focuslab}
    username: ${DB_USER:focuslab}
    password: ${DB_PASSWORD:focuslab}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Dialect-от не се задава рачно — Hibernate го распознава од драјверот.
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 22MB

  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-account@yourdomain.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS:true}
          ssl:
            trust: ${MAIL_HOST:smtp.office365.com}

  # Пул за @Async известувањата
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8

app:
  # Основа за линковите во email известувањата (пр. .../sessions/12)
  frontend:
    base-url: ${FRONTEND_ORIGIN:http://localhost:5173}

  auth:
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:students.finki.ukim.mk,finki.ukim.mk}

    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}

  jwt:
    secret: ${JWT_SECRET:promeni-ja-ovaa-tajna-vo-produkcija-focuslab-2026-minimum-256-bit}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 часа

  mail:
    from: ${MAIL_FROM:focuslab@yourdomain.com}

  admin:
    email: ${ADMIN_EMAIL:admin@focuslab.mk}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

  security:
    # X-Forwarded-For се верува само зад proxy (docker-compose го поставува)
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}

  cors:
    # Може и повеќе origin-и, разделени со запирка
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    mk.focuslab: INFO
