<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCUS Lab</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/focuslab-logo-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/focuslab-logo-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/focuslab-logo-192.png" />
    <meta name="theme-color" content="#1D4ED8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script>
      // Темата се поставува ПРЕД React да се вчита, инаку страницата за миг
      // трепка во светла тема пред да се пресмета точната. Истата логика е и
      // во ThemeContext.tsx — тука е само за да нема трепкање.
      (function () {
        try {
          var stored = localStorage.getItem('focuslab_theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
          }
        } catch (error) {
          // приватен режим / блокирано складирање — се продолжува со светла тема
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
