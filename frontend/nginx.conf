# Кеширањето се решава со map, а не со add_header во посебни location блокови:
# во nginx, add_header во location ги ГАСИ заглавјата од server нивото наместо да
# ги додаде. Со map сите заглавја остануваат на едно место и важат секаде.
map $uri $focuslab_cache {
    default                "no-store";
    ~^/assets/             "public, max-age=31536000, immutable";
    ~^/brand/              "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Прелистувачот смее да вчита само од овој домен и од Google Fonts. Ако
    # некогаш во страницата влезе туѓ скрипт, тој нема ни да се изврши ни да
    # може да прати податоци некаде — а токенот стои во localStorage, па оваа
    # линија е тоа што го чува.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $focuslab_cache always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
