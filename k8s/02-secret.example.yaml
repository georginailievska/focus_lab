# Образец за тајните. ВИСТИНСКИОТ фајл не се комитира.
#
#   cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#   # отвори го и смени ги четирите вредности
#   kubectl apply -f k8s/02-secret.yaml
#
# k8s/02-secret.yaml е во .gitignore. Репото е јавно, а Secret во Kubernetes е
# само base64 — не е шифриран, па во репо не смее да влезе вистинска вредност.
#
# JWT_SECRET: најмалку 32 знаци и НЕ смее да биде вредноста од application.yml.
# ADMIN_PASSWORD: не смее да биде ChangeMe123!.
# SecretsGuard во апликацијата одбива да стартува ако ова не е испочитувано —
# нарочно, за да не се објави апликација со тајна од репото.
apiVersion: v1
kind: Secret
metadata:
  name: focuslab-secrets
  namespace: focus-lab
  labels:
    app.kubernetes.io/part-of: focus-lab
type: Opaque
stringData:
  DB_PASSWORD: "СМЕНИ-МЕ-лозинка-за-база"
  JWT_SECRET: "СМЕНИ-МЕ-долга-случајна-низа-од-најмалку-32-знаци"
  ADMIN_PASSWORD: "СМЕНИ-МЕ-силна-лозинка"
  MAIL_PASSWORD: "СМЕНИ-МЕ-или-остави-го-ова-ако-нема-SMTP"
