# Базата е StatefulSet, не Deployment.
#
# Разликата што е важна тука: StatefulSet му дава на подот постојано име
# (postgres-0) и свој постојан диск преку volumeClaimTemplates. Deployment би
# му давал ново име и нов празен диск на секое создавање — што за база значи
# губење на сите податоци.
#
# Service-от е headless (clusterIP: None): за една база не ни треба
# рамномерна распределба на барањата, туку стабилно име за поврзување.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: focus-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: focus-lab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: focus-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: focus-lab
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: focus-lab
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432

          env:
            # Имињата што ги чека Postgres се други од оние што ги чека
            # апликацијата, па тука се пресликуваат клуч по клуч
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: focuslab-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: focuslab-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: focuslab-secrets
                  key: DB_PASSWORD

            # Поддиректориум, а не самиот корен на дискот: Kubernetes создава
            # lost+found во точката на монтирање, а Postgres одбива да
            # иницијализира директориум што не е празен.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
