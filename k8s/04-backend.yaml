# Service-от МОРА да се вика точно „backend".
#
# frontend/nginx.conf има proxy_pass http://backend:8080/api/, а nginx го
# разрешува тоа име при стартување. Со друго име frontend подот воопшто не
# се крева („host not found in upstream").
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: focus-lab
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: focus-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: focus-lab
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: focus-lab
spec:
  # Една реплика намерно. Апликацијата има @Scheduled работи (дневен потсетник
  # на email, чистење стари известувања) — со две реплики тие би се извршиле
  # двапати, па секој студент би добил два потсетника. Ограничувањето на најави
  # исто така брои во меморија, по под.
  replicas: 1

  # Recreate наместо RollingUpdate: при обновување не смеат да постојат два
  # пода истовремено, по истата причина.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: focus-lab
    spec:
      containers:
        - name: backend
          # СМЕНИ DOCKERHUB_USERNAME со своето име на Docker Hub
          image: docker.io/DOCKERHUB_USERNAME/focus-lab-backend:latest
          # IfNotPresent: така работи и со имиџ граден локално, што е потребно
          # на Apple Silicon (имиџот од CI е amd64)
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          # Клучевите во ConfigMap и Secret се исти како променливите што ги
          # чита апликацијата, па не треба пресликување
          envFrom:
            - configMapRef:
                name: focuslab-config
            - secretRef:
                name: focuslab-secrets

          # startupProbe му дава на Spring Boot до 150 секунди да се подигне и
          # да ја создаде шемата. Дури потоа почнува да важи livenessProbe —
          # инаку бавниот прв старт би изгледал како паднат под.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
