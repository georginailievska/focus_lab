# Фронтендот е само nginx со изградени статички фајлови — нема состојба, па
# смее да има повеќе реплики и обично RollingUpdate обновување.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: focus-lab
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: focus-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: focus-lab
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: focus-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: focus-lab
    spec:
      containers:
        - name: frontend
          # СМЕНИ georgina1 со своето име на Docker Hub
          image: docker.io/georgina1/focus-lab-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
